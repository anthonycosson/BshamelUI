# =========================================================================
#  Bshamel UI — pipeline GitLab
#
#  Deux étapes :
#    lint    — à chaque push et à chaque merge request
#    release — uniquement sur un tag `v*` protégé
#
#  Le packager BigWigs (`dev/packager/release.sh`) est du bash autonome : ses seuls
#  blocs spécifiques à GitHub sont conditionnés par $GITHUB_ACTIONS, absent ici.
#  Les envois vers CurseForge sont de simples appels HTTP, GitLab suffit.
# =========================================================================

stages:
  - lint
  - release

variables:
  # Le packager déduit la version et le changelog de l'historique git :
  # un clone superficiel le priverait des tags.
  GIT_DEPTH: "0"
  GIT_STRATEGY: clone

# -------------------------------------------------------------------------
lint:
  stage: lint
  image: alpine:3.20
  before_script:
    - apk add --no-cache bash git grep coreutils lua5.1 lua5.1-dev luarocks5.1 build-base
    - luarocks-5.1 install luacheck
  script:
    - luacheck .
    - bash dev/scripts/check-design.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# -------------------------------------------------------------------------
release:
  stage: release
  image: alpine:3.20
  before_script:
    # `jq` est indispensable : sans lui le packager construit le zip puis
    # **saute silencieusement l'envoi** avec un simple avertissement.
    # `unzip` est requis par l'étape de vérification de l'archive.
    - apk add --no-cache bash git curl zip unzip jq grep sed gawk coreutils
    - jq --version
  script:
    # `-d` produit le zip sans rien envoyer si le token est absent : la
    # pipeline reste verte tant que le projet CurseForge n'existe pas encore.
    - |
      if [ -z "${CF_API_KEY:-}" ]; then
        echo "CF_API_KEY absent — packaging à blanc, aucun envoi."
        bash dev/packager/release.sh -d -o -r "$PWD/dev/build"
      else
        bash dev/packager/release.sh -r "$PWD/dev/build"
      fi
  artifacts:
    paths:
      - dev/build/*.zip
    expire_in: 30 days
  rules:
    # Uniquement sur un tag : les variables protégées (CF_API_KEY) ne sont
    # exposées qu'aux tags protégés, jamais à une branche ou une MR de fork.
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
